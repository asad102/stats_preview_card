<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats preview card component</title>
    <!-- favico -->
    <link rel="shortcut icon" href="img/favicon-32x32.png" type="image/x-icon">
    <!-- tailwindcss  -->
    <link rel="stylesheet" href="./css/style.css">
    <!-- google fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

    <main class="font-inter bg-mainbg min-h-screen flex justify-center items-center">
        <article class=" bg-cardbg md:max-w-screen-sc max-w-screen-mo mx-auto md:my-0 my-6  flex flex-col-reverse md:flex-row rounded-lg  overflow-hidden">
            <section class="text-White flex flex-col flex-1 md:px-[70px] px-7 md:text-start text-center">
                <h1 class="md:text-heading text-sheading font-inter md:mt-20 mt-10">Get <span class="text-txtblue">insights</span>  that help your business grow.</h1>
                <p class="text-part md:w-96 w-full md:mt-6 mt-4 opacity-75">Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>
                <div class="flex md:flex-row flex-col md:gap-16 gap-6  md:my-16 my-10">
                    <div class="">
                        <h3 class="font-inter text-stath ">10k+</h3>
                        <span class="font-lexa text-stats opacity-60">Companies</span>
                    </div>
                    <div class="">
                        <h3 class="font-inter text-stath ">314</h3>
                        <span class="font-lexa text-stats opacity-60">Templates</span>
                    </div>
                    <div class="">
                        <h3 class="font-inter text-stath ">12M+</h3>
                        <span class="font-lexa text-stats opacity-60">Queries</span>
                    </div>
                </div>
            </section>
            <div class="relative">
                <picture>
                    <source media="(min-width: 768px)" srcset="./img/image-header-desktop.jpg">
                    <img src="./img/image-header-mobile.jpg" alt="cardimg" class="w-full h-full object-cover  ">
                    <div class="absolute inset-0 bg-txtblue opacity-75 mix-blend-multiply"></div>
                </picture>
            </div>

        </article>
    </main>

</body>
</html>
