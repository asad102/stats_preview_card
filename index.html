<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats preview card component</title>
    <!-- favico -->
    <link rel="shortcut icon" href="img/favicon-32x32.png" type="image/x-icon">
    <!-- tailwindcss  -->
    <link rel="stylesheet" href="./css/style.css">
    <!-- google fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

    <main class="font-inter text-[15px] min-h-screen grid place-items-center justify-center bg-Verydarkbluemainbackground ">
        <article class="flex flex-col-reverse lg:flex-row lg:max-w-[1110px] max-w-[327px] max-h-[780px] lg:m-0 m-4  rounded-lg bg-Darkdesaturatedbluecardbackground overflow-hidden">
            <hgroup class=" text-White flex flex-col justify-between flex-1 lg:text-start text-center lg:px-24 lg:py-[70px] p-4">
                <hgroup class="flex flex-col gap-8">
                    <h1 class="font-inter font-bold lg:text-4xl text-3xl lg:leading-10 leading-8">Get <span class="text-Softvioletaccent">insights</span>  that help your business grow.</h1>
                    <p class="font-normal leading-6 opacity-50">Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>
                </hgroup>
                <hgroup class="flex lg:flex-row flex-col lg:gap-16 gap-6 lg:my-0 my-4 ">
                    <div class="flex flex-col gap-1">
                        <h3 class="font-inter font-bold text-2xl ">10k+</h3>
                        <span class="font-lexa font-normal text-[12px] leading-6 tracking-[1px] uppercase">Companies</span>
                    </div>
                    <div class="flex flex-col gap-1">
                        <h3 class="font-inter font-bold text-2xl ">314</h3>
                        <span class="font-lexa  font-normal text-[12px] leading-6 tracking-[1px] uppercase">Templates</span>
                    </div>
                    <div class="flex flex-col gap-1">
                        <h3 class="font-inter font-bold text-2xl ">12M+</h3>
                        <span class="font-lexa font-normal text-[12px] leading-6 tracking-[1px] uppercase">Queries</span>
                    </div>
                </hgroup>
            </hgroup>
            <div class="relative">
                <picture>
                  <source media="(min-width: 768px)" srcset="./img/image-header-desktop.jpg">
                  <img src="./img/image-header-mobile.jpg" alt="cardimg" class="w-full object-cover">
                </picture>
                <div class="absolute inset-0 bg-Softvioletaccent opacity-50"></div>
              </div>
        </article>
    </main>

</body>
</html>
